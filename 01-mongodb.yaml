- name: configure mongodb server
  hosts: mongodb
  become: yes
  tasks: 
  - name: copy mongo repo
    ansible.builtin.copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

  - name: install mongodb server
    package:
     name: mongodb-org
     state: present

  - name: enable and started mongodb
    service:
      name: mongod
      state: started 
      enabled: yes

  - name: allow remote connection 
    replace:
      path: /etc/mongod.conf
      regexp: '127.0.0.1'
      replace: '0.0.0.0'


  



