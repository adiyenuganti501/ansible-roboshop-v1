- name: configure mongodb server
  hosts: mongodb
  become: yes
  tasks: 
  - name: copy mongo repo
    ansible.builtin.copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

  - name: install mongodb server
    package:
     name: mongodb-org
     state: present

  - name: enable and started mongodb
    service:
      name: mongodb
      state: started 
      enabled: yes


  



