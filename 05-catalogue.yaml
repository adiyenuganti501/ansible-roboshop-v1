- name: configure catalogue server
  hosts: catalogue
  become: yes

  tasks:
  - name: disabled default nodejs
    command: dnf module disable nodejs -y

  - name: install node js 
    dnf:
      name: nodejs
      state: present

  - name: create roboshop user
    user:
      name: roboshop
      create_home: false
      home: /app
      system: true
      shell: /sbin/nologin
      comment: "roboshop system user"

  - name: remove existing directory
    file:
      path: /app
      state: absent

  - name: remove catalog zip
    file:
      path: /tmp/catalogue.zip
      state: absent

  - name: create app directory
    file: 
      path: /app
      state: directory
  
  - name: dowload catalogue applicarion
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
      dest: /tmp/catalogue.zip

  - name: unzip catalogue code
    unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes

  - name: install dependencies
    community.general.npm:
      path: /app

  - name: copy catalogue serveice
    template:
      src: catalogue.service.j2
      dest: /etc/systemd/system/catalogue.service

  - name: copy mongo repo
    copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

  - name: install mongodb client
    dnf:
      name: mongodb-mongosh
      state: present
  
  - name: check products loaded or not
    command: mongosh --host "{{ mongodb_host }}" --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
    register: product_count 
  - name: print product count 
    debug:
      msg: "{{ product_count.stdout }}"

  - name: load products
    command: mongosh --host "{{ mongodb_host }}" --quiet /app/schema/catalogue.js
    when: product_count.stdout|int == 0

  - name: daemon reload
    systemd_service:
      daemon_reload: yes
  
  - name: starta and enable catalogue service
    service:
      name: catalogue
      state: started
      enabled: yes








