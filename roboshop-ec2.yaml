- name: create ec2 instances and r53 records
  hosts: local
  connection: local
  vars:
    instances: ['mongodb']
    what_to_do: create
    domine_name: khiranya.online
    ami_id: ami-0055977a6e828a4f4

  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance: 
     name: "roboshop-{{ item }}"
     image_id: "{{ ami_id }}"
     instance_type: t3.micro
     security_groups:
     - RS-Common
     - "roboshop-{{ item }}"
     region: us-east-1
    loop: "{{ instances }}"
    when: what_to_do == "create"
    register: "instance_output"
  
  # - name: Take output
  #   debug:
  #     msg: "{{instance_output.results[0].instances[0].private_ip_address}}"
      

  - name: create r53 record
    amazon.aws.route53:
     state: present
     zone: "{{ domain_name }}"
     record: "{{ item.item }}.{{ domain_name }}"
     type: A
     ttl: 1
     value: "{{ item.instances[0].private_ip_address }}"
     overwrite: true
    loop: "{{ ec2_output.results }}"
    when: what_to_do == "create"




  
